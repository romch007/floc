[package]
name = "floc"
authors = ["Romain Chardiny <romain.chardiny@gmail.com>"]
description = "Compiler for the Flo programming language"
version = "0.3.0"
license = "MIT"
edition = "2024"
build = "build.rs"

[lib]
name = "floc"
path = "src/lib.rs"

[[bin]]
name = "floc"

[dependencies]
floc-span = { workspace = true }
floc-lexer = { workspace = true }
floc-ast = { workspace = true }
floc-parser = { workspace = true }
floc-analyzer = { workspace = true }
cc = { workspace = true }
clap = { workspace = true, features = ["derive", "cargo"] }
fastrand = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
scopeguard = { workspace = true }
thiserror = { workspace = true }
llvm-sys = { workspace = true }
clap_complete = { workspace = true }
logos = { workspace = true }
owo-colors = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
inkwell = { workspace = true, features = ["llvm23-1-prefer-dynamic", "target-all"] }

[target.'cfg(windows)'.dependencies]
inkwell = { workspace = true, features = [
    "llvm23-1-force-static",
    "target-x86",
    "target-aarch64",
] }

[build-dependencies]
bindgen = { workspace = true }
cc = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
