[workspace]
members = [
    "crates/floc",
    "crates/floc-span",
    "crates/floc-lexer",
    "crates/floc-ast",
    "crates/floc-parser",
    "crates/floc-analyzer",
    "crates/floc-lsp",
]
resolver = "3"

[workspace.dependencies]
floc-analyzer = { path = "crates/floc-analyzer" }
floc-ast = { path = "crates/floc-ast" }
floc-lexer = { path = "crates/floc-lexer" }
floc-parser = { path = "crates/floc-parser" }
floc-span = { path = "crates/floc-span" }

bindgen = "0.73.2"
cc = "1.11.1"
chumsky = "0.13.0"
clap = "4.6.7"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
fastrand = "2.5.0"
inkwell = { version = "0.11.0", default-features = false }
llvm-sys = "231.0.2"
logos = "0.16.1"
miette = "7.6.0"
owo-colors = "4.4.0"
scopeguard = "1.2.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tower-lsp-server = "0.23.0"

[profile.release]
codegen-units = 1
lto = "fat"
